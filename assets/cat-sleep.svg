<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="고양이 냥이">
  <!-- tail -->
  <path d="M150 160 C185 150 190 110 170 95" fill="none" stroke="#f2a65a" stroke-width="14" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="100" cy="150" rx="55" ry="40" fill="#f6b26b"/>
  <ellipse cx="100" cy="158" rx="30" ry="24" fill="#fff4e6"/>
  <!-- ears -->
  <path d="M48 70 L58 20 L90 52 Z" fill="#f6b26b"/>
  <path d="M152 70 L142 20 L110 52 Z" fill="#f6b26b"/>
  <path d="M58 60 L62 34 L80 52 Z" fill="#ffc9c9"/>
  <path d="M142 60 L138 34 L120 52 Z" fill="#ffc9c9"/>
  <!-- head -->
  <circle cx="100" cy="85" r="52" fill="#f6b26b"/>
  <!-- stripes -->
  <path d="M100 34 L100 50 M86 37 L89 50 M114 37 L111 50" stroke="#e08e3c" stroke-width="5" stroke-linecap="round"/>
  <!-- eyes -->
  <g class="eyes">
    <path d="M72 86 Q80 93 88 86" fill="none" stroke="#3b2a20" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M112 86 Q120 93 128 86" fill="none" stroke="#3b2a20" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- cheeks -->
  <ellipse cx="68" cy="102" rx="9" ry="5" fill="#ff9e9e" opacity=".6"/>
  <ellipse cx="132" cy="102" rx="9" ry="5" fill="#ff9e9e" opacity=".6"/>
  <!-- nose & mouth -->
  <path d="M95 97 L105 97 L100 103 Z" fill="#e5737a"/>
  <path d="M100 103 Q94 110 88 106 M100 103 Q106 110 112 106" fill="none" stroke="#3b2a20" stroke-width="2.5" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M60 95 L35 90 M60 101 L36 104 M140 95 L165 90 M140 101 L164 104" stroke="#3b2a20" stroke-width="2" stroke-linecap="round"/>
  <!-- paws -->
  <ellipse cx="78" cy="185" rx="14" ry="9" fill="#f6b26b"/>
  <ellipse cx="122" cy="185" rx="14" ry="9" fill="#f6b26b"/>
</svg>
