<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>냥이 색칠하기 - 냥냥놀이터</title>
  <meta name="description" content="번호대로 칸을 칠하면 귀여운 고양이 그림이 완성돼요.">
  <meta name="theme-color" content="#fff4e6">
  <link rel="icon" href="../../assets/cat.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="coloring.css">
</head>
<body>
  <nav class="topbar">
    <a class="back" href="../../" id="back">‹ 홈</a>
    <span class="title" id="title">냥이 색칠하기</span>
    <span class="progress" id="progress"></span>
  </nav>

  <section id="picker">
    <p class="hint">칠할 그림을 골라 주세요</p>
    <ul class="picture-list" id="picture-list"></ul>
  </section>

  <section id="play" hidden>
    <div class="board" id="board"></div>
    <div class="palette" id="palette"></div>
  </section>

  <div class="done" id="done" hidden>
    <div class="done-box">
      <img src="../../assets/cat.svg" alt="" width="96" height="96">
      <p class="done-title">완성했어요!</p>
      <p class="done-sub">냥이가 기뻐해요</p>
      <button type="button" id="done-btn">다른 그림 칠하기</button>
    </div>
  </div>

  <script src="pictures.js"></script>
  <script src="coloring.js"></script>
</body>
</html>
