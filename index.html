<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>냥냥놀이터 - 고양이와 함께하는 한 판 게임</title>
  <meta name="description" content="심심할 때 한 판! 고양이 냥이와 함께하는 간단한 휴대폰 게임 모음.">
  <meta name="theme-color" content="#fff4e6">
  <link rel="icon" href="assets/cat.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="hero">
    <img class="hero-cat" src="assets/cat.svg" alt="고양이 냥이" width="160" height="160">
    <h1>냥냥놀이터</h1>
    <p class="tagline">심심할 때 냥이랑 한 판!</p>
  </header>

  <main>
    <h2 class="section-title">게임</h2>
    <ul class="game-list">
      <li>
        <a class="game-card" href="games/snack/">
          <span class="game-icon" aria-hidden="true">🐟</span>
          <span class="game-text">
            <strong>간식 받기</strong>
            <small>간식은 받고, 오이·초콜릿·썩은 고기는 피하기!</small>
          </span>
          <span class="badge play">하기 ›</span>
        </a>
      </li>
      <li>
        <a class="game-card" href="games/mouse/">
          <span class="game-icon" aria-hidden="true">🐭</span>
          <span class="game-text">
            <strong>쥐 잡기</strong>
            <small>튀어나온 쥐를 톡! 강아지는 건드리지 마세요</small>
          </span>
          <span class="badge play">하기 ›</span>
        </a>
      </li>
    </ul>
  </main>

  <footer>
    <p>© 2026 냥냥놀이터</p>
  </footer>
</body>
</html>
