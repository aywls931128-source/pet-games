<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>냥냥놀이터 - 고양이와 함께하는 한 판 게임</title>
  <meta name="description" content="심심할 때 한 판! 고양이 냥이와 함께하는 간단한 휴대폰 게임 모음.">
  <meta name="theme-color" content="#fff4e6">
  <link rel="icon" href="assets/cat.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="hero">
    <img class="hero-cat" src="assets/cat.svg" alt="고양이 냥이" width="160" height="160">
    <h1>냥냥놀이터</h1>
    <p class="tagline">심심할 때 냥이랑 한 판!</p>
  </header>

  <main>
    <h2 class="section-title">게임</h2>
    <ul class="game-list">
      <li>
        <div class="game-card soon">
          <span class="game-icon" aria-hidden="true">🎨</span>
          <span class="game-text">
            <strong>냥이 색칠하기</strong>
            <small>번호대로 칠하면 그림 완성</small>
          </span>
          <span class="badge">곧 공개</span>
        </div>
      </li>
      <li>
        <div class="game-card soon">
          <span class="game-icon" aria-hidden="true">🍼</span>
          <span class="game-text">
            <strong>냥이 키우기</strong>
            <small>밥 주고, 씻기고, 재워 주세요</small>
          </span>
          <span class="badge">준비 중</span>
        </div>
      </li>
    </ul>
  </main>

  <footer>
    <p>© 2026 냥냥놀이터</p>
  </footer>
</body>
</html>
